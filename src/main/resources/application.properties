spring.application.name=currency-bot

bot.name=${BOT_NAME}
bot.token=${BOT_TOKEN}

spring.datasource.url=jdbc:postgresql://localhost:5432/currencydb
spring.datasource.username=tradingbot
spring.datasource.password=tradingbot_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
timeweb.agent.base-url=${TIMEWEB_AGENT_BASE_URL:stub}
timeweb.agent.token=${TIMEWEB_AGENT_TOKEN:stub}

bot.admin.chatId=${BOT_ADMIN:stub}

# AES-256-GCM master key for encrypting exchange API credentials.
# Must be a Base64-encoded 32-byte (256-bit) random value.
# Generate with: openssl rand -base64 32
encryption.key=${ENCRYPTION_KEY:}

# Shared secret for /internal/portfolio/{chatId} — must match currencybot.internal.token
# in mcp-server's application.properties. Generate with: openssl rand -hex 32
internal.mcp.token=${INTERNAL_MCP_TOKEN:stub}