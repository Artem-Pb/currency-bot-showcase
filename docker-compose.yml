services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: currencydb
      POSTGRES_USER: tradingbot
      POSTGRES_PASSWORD: tradingbot_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingbot -d currencydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/currencydb
      SPRING_DATASOURCE_USERNAME: tradingbot
      SPRING_DATASOURCE_PASSWORD: tradingbot_pass
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
