spring.application.name=currency-bot-mcp

# Идентификация сервера для MCP-клиента (агента Timeweb) при рукопожатии
spring.ai.mcp.server.name=currency-bot-news-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Инструменты для получения свежих крипто-новостей для Currency Bot агента

# 8081, не 8080 — сам currency-bot тоже поднимает embedded web-сервер на 8080 (spring-boot-starter-web)
server.port=8081

# Адрес currency-bot для get_user_portfolio (internal.mcp.token в его application.properties
# должен совпадать с currencybot.internal.token ниже)
currencybot.internal.base-url=${CURRENCYBOT_INTERNAL_BASE_URL:http://localhost:8080}
currencybot.internal.token=${INTERNAL_MCP_TOKEN:stub}
